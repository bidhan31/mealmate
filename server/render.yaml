services:
  - type: web
    name: mealmate-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Dhaka
      - key: CURRENCY
        value: BDT
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Leave unset (defaults to false in production) or set to "true" as a
      # temporary unblock while the mail provider is unavailable.
      - key: ALLOW_UNVERIFIED_LOGIN
        sync: false
      # 'brevo' | 'smtp' | 'console' — unset to auto-detect.
      - key: MAIL_PROVIDER
        sync: false
      # SMTP transport (optional alternative to Brevo, e.g. Gmail).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://dev-mealmate.netlify.app,http://localhost:5173
